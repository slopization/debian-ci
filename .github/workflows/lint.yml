name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck -x scripts/*.sh tests/*.sh

  source-recipe-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev git xz-utils shellcheck

      - name: Test versions, source assembly, and quilt extraction
        run: bash tests/prepare-source-tree.sh

      - name: Test native and cross sbuild commands and artifacts
        run: bash tests/run-sbuild.sh

  webhook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test github-app/worker.test.mjs

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >>"$GITHUB_PATH"

      - name: Run actionlint
        # actionlint 1.7.12 predates the job.workflow_repository and
        # job.workflow_sha contexts; both are documented GitHub Actions
        # contexts and are used to check out this workflow's own commit.
        run: |
          actionlint -color \
            -ignore 'property "workflow_repository" is not defined' \
            -ignore 'property "workflow_sha" is not defined' \
            .github/workflows/*.yml examples/*.yml
