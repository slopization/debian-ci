name: Debian package
on:
  workflow_call:
    inputs:
      source-repository:
        description: "Source repository (owner/name), allowlisted by the recipe caller"
        required: true
        type: string
      source-sha:
        description: "Full lowercase 40-character source commit SHA"
        required: true
        type: string
      source-tag:
        description: "Raw source tag verified by the bridge; empty for a snapshot"
        type: string
        default: ""
      recipe-repository:
        description: "Explicit recipe repository (owner/name)"
        required: true
        type: string
      recipe-sha:
        description: "Full lowercase 40-character recipe commit SHA"
        required: true
        type: string
      suite:
        type: string
        default: trixie
      host-arch:
        description: "Debian host architecture (native by default; riscv64 for the kernel)"
        type: string
        default: native
      artifact-name:
        description: "Defaults to debs-<source-sha>-<suite>"
        type: string
        default: ""
    secrets:
      SOURCE_READ_TOKEN:
        description: "Only needed for private sources"
        required: false
      RECIPE_READ_TOKEN:
        description: "Only needed for private recipes"
        required: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SBUILD_SUITE: ${{ inputs.suite }}
      HOST_ARCH: ${{ inputs.host-arch }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Validate inputs
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RECIPE_REPOSITORY: ${{ inputs.recipe-repository }}
          RECIPE_SHA: ${{ inputs.recipe-sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECIPE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$RECIPE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REPOSITORY" != *-debian && "$RECIPE_REPOSITORY" == "${SOURCE_REPOSITORY}-debian" ]]
          [[ "$RECIPE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$SBUILD_SUITE" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$HOST_ARCH" =~ ^[a-z0-9][a-z0-9-]*$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.recipe-repository }}
          ref: ${{ inputs.recipe-sha }}
          token: ${{ secrets.RECIPE_READ_TOKEN || github.token }}
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Install isolated build tooling
        run: |
          .ci/scripts/install-build-deps.sh
          .ci/scripts/enable-userns.sh
      - name: Assemble source snapshot and pinned recipe
        id: prepare
        env:
          SOURCE_TAG: ${{ inputs.source-tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RECIPE_SHA: ${{ inputs.recipe-sha }}
        run: |
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git -C recipe rev-parse HEAD)" == "$RECIPE_SHA" ]]
          .ci/scripts/prepare-source-tree.sh \
            --source "$GITHUB_WORKSPACE/source" --recipe "$GITHUB_WORKSPACE/recipe" \
            --workspace "$RUNNER_TEMP/package-build/pkg" --suite "$SBUILD_SUITE" \
            --tag "$SOURCE_TAG" --output-file "$GITHUB_OUTPUT"
      - name: Build quilt source package
        id: source
        env:
          BUILD_WORKSPACE: ${{ steps.prepare.outputs.workspace }}
        run: .ci/scripts/build-source-package.sh --workspace "$BUILD_WORKSPACE" --output-file "$GITHUB_OUTPUT"
      - name: Build isolated binaries
        env:
          SOURCE_DSC: ${{ steps.source.outputs.dsc }}
        run: .ci/scripts/run-sbuild.sh --dsc "$SOURCE_DSC" --artifact-dir "$ARTIFACT_DIR" --host-arch "$HOST_ARCH"
      - name: Record provenance
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          RECIPE_REPOSITORY: ${{ inputs.recipe-repository }}
          RECIPE_SHA: ${{ inputs.recipe-sha }}
        run: |
          jq -n --arg build_repository "$GITHUB_REPOSITORY" \
            --arg source_repository "$SOURCE_REPOSITORY" --arg source_sha "$SOURCE_SHA" \
            --arg source_tag "$SOURCE_TAG" \
            --arg recipe_repository "$RECIPE_REPOSITORY" --arg recipe_sha "$RECIPE_SHA" \
            --arg suite "$SBUILD_SUITE" --arg host_arch "$HOST_ARCH" --arg run "$GITHUB_RUN_ID" \
            '{build_repository:$build_repository, source_repository:$source_repository,
              source_sha:$source_sha, source_tag:$source_tag, recipe_repository:$recipe_repository,
              recipe_sha:$recipe_sha, suite:$suite, host_arch:$host_arch, run_id:$run}' > "$ARTIFACT_DIR/build-provenance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name || format('debs-{0}-{1}', inputs.source-sha, inputs.suite) }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
