# Install in the RECIPE repository; publish a successful build from that repo.
name: Publish existing Debian packages

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: "Successful build workflow run ID from this repository"
        required: true
        type: string
      artifact-name:
        description: "Package artifact name from that build run"
        required: true
        type: string
      suite:
        description: "Debian repository codename to publish to"
        required: false
        type: string
        default: trixie

permissions:
  actions: read
  contents: read

jobs:
  publish:
    uses: slopization/debian-ci/.github/workflows/publish.yml@v2.0.1
    with:
      build-run-id: ${{ inputs.build-run-id }}
      artifact-name: ${{ inputs.artifact-name }}
      suite: ${{ inputs.suite }}
    secrets:
      DEB_CREDENTIALS: ${{ secrets.DEB_CREDENTIALS }}
